#Configuraçao do Nginx para o ERP
resolver 127.0.0.11 valid=10s ipv6=off;

#Servidor de aplicação do ERP e seus replicas
upstream erp_backend {
    zone erp_backend 64k;
    least_conn;
    server backend:8080 resolve;
    server backend-replica:8080 resolve;
}

# Servidor Nginx que recebe as requisições e encaminha para o servidor de aplicação do ERP
server {
    listen 80;
    server_name _;
    client_max_body_size 10m;

    location / {
        proxy_pass http://erp_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
