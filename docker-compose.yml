# Configuração do Docker Compose para o ERP
x-backend-common: &backend-common
  build: ./backend
  restart: always
  environment: &backend-environment
    DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}?schema=public"
  env_file:
    - ./backend/.env
  expose:
    - "8080"
  depends_on:
    database:
      condition: service_healthy
  healthcheck:
    test:
      [
        "CMD",
        "node",
        "-e",
        "fetch('http://127.0.0.1:8080/api-docs').then((r) => process.exit(r.status < 500 ? 0 : 1)).catch(() => process.exit(1))",
      ]
    interval: 10s
    timeout: 5s
    retries: 5
    start_period: 20s

# Imagem postgres:16-alpine é utilizada para o banco de dados PostgreSQL
services:
  database:
    image: postgres:16-alpine
    container_name: senzalas_postgres
    restart: always

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10

  # Configuração do backend do ERP e seus replicas
  backend:
    <<: *backend-common
    environment:
      <<: *backend-environment
      ENABLE_MONTHLY_BILLING_JOB: "true"

  backend-replica:
    <<: *backend-common
    environment:
      <<: *backend-environment
      ENABLE_MONTHLY_BILLING_JOB: "false"

  nginx:
    image: nginx:1.29-alpine
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      backend-replica:
        condition: service_healthy

volumes:
  postgres_data:
